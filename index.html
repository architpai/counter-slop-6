<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#131a26">
  <title>Counter Slop 6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
  <script type="module">
    import('./src/main.js').catch(error => {
      const panel = document.createElement('div');
      panel.style.cssText = 'position:fixed;inset:0;display:grid;place-content:center;gap:1rem;padding:2rem;background:#131a26;color:#f2f5fa;font:16px/1.6 system-ui;pointer-events:auto';
      const title = document.createElement('h1');
      title.textContent = 'The game could not start';
      const message = document.createElement('p');
      message.textContent = 'Check that WebGL is enabled and that the network can load the game libraries. Then reload this page.';
      const detail = document.createElement('pre');
      detail.textContent = error.message;
      detail.style.whiteSpace = 'pre-wrap';
      const reload = document.createElement('button');
      reload.textContent = 'Reload';
      reload.onclick = () => location.reload();
      panel.append(title, message, detail, reload);
      document.getElementById('hud').replaceChildren(panel);
      document.documentElement.dataset.gameStatus = 'error';
    });
  </script>
</head>
<body><canvas id="game" aria-label="First-person game view"></canvas><div id="hud"></div></body>
</html>
